<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EPUB Reader</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#fcf9f2',
                            100: '#f5efe6',
                            200: '#e6dcce',
                            700: '#8c4a32',
                            800: '#433831',
                            900: '#2c221e',
                        },
                        mint: {
                            50: '#eaf4f0',
                            100: '#dbece5',
                            200: '#bfded2',
                            700: '#1b6b4a',
                            800: '#1e3a31',
                            900: '#102620',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icon Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Import Local Foliate JS Web Component -->
    <script type="module" src="./foliate-js/view.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --heading-color: #111827;
            --ui-bg: #f8fafc;
            --ui-border: #e2e8f0;
            --active-item: #2563eb;
            --highlight-bg: #fef08a;
        }

        .dark {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --heading-color: #ffffff;
            --ui-bg: #1e293b;
            --ui-border: #334155;
            --active-item: #60a5fa;
            --highlight-bg: #854d0e;
        }

        .cream {
            --bg-color: #fcf9f2;
            --text-color: #433831;
            --heading-color: #2c221e;
            --ui-bg: #f5efe6;
            --ui-border: #e6dcce;
            --active-item: #8c4a32;
            --highlight-bg: #fde68a;
        }

        .mint {
            --bg-color: #eaf4f0;
            --text-color: #1e3a31;
            --heading-color: #102620;
            --ui-bg: #dbece5;
            --ui-border: #bfded2;
            --active-item: #1b6b4a;
            --highlight-bg: #a7f3d0;
        }

        /* Warm Cream Theme UI overrides */
        .cream body, .cream header, .cream footer, .cream aside, 
        .cream #info-overlay, .cream #settings-overlay, .cream #bookmark-overlay, .cream #loading-overlay {
            background-color: #fcf9f2 !important;
            border-color: #e6dcce !important;
            color: #433831 !important;
        }
        .cream .bg-slate-50, .cream .bg-slate-100 {
            background-color: #f5efe6 !important;
        }
        .cream .hover\:bg-slate-100:hover, .cream .hover\:bg-slate-200:hover {
            background-color: #eae1d3 !important;
        }
        .cream .text-slate-600, .cream .text-slate-700, .cream .text-slate-800, .cream .text-slate-500, .cream .text-slate-400 {
            color: #433831 !important;
        }

        /* Mint Theme UI overrides */
        .mint body, .mint header, .mint footer, .mint aside, 
        .mint #info-overlay, .mint #settings-overlay, .mint #bookmark-overlay, .mint #loading-overlay {
            background-color: #eaf4f0 !important;
            border-color: #bfded2 !important;
            color: #1e3a31 !important;
        }
        .mint .bg-slate-50, .mint .bg-slate-100 {
            background-color: #dbece5 !important;
        }
        .mint .hover\:bg-slate-100:hover, .mint .hover\:bg-slate-200:hover {
            background-color: #cde3d9 !important;
        }
        .mint .text-slate-600, .mint .text-slate-700, .mint .text-slate-800, .mint .text-slate-500, .mint .text-slate-400 {
            color: #1e3a31 !important;
        }

        /* Touch & Layout handling */
        button, input, select, label, header, footer {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        foliate-view {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--ui-border);
            border-top: 4px solid var(--active-item);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        mark {
            background-color: var(--highlight-bg);
            color: inherit;
            padding: 0 2px;
            border-radius: 2px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }

        header {
            padding-top: env(safe-area-inset-top, 0px);
        }
        footer {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col font-sans antialiased overflow-hidden transition-colors duration-200 select-none">

    <!-- TOP TOOLBAR -->
    <header id="toolbar" class="min-h-[3.5rem] border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur flex items-center justify-between px-3 sm:px-4 z-20 shrink-0 gap-2">
        
        <!-- Left Group: Open File, TOC & Search -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
            <label class="cursor-pointer flex items-center space-x-1.5 px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg shadow-sm transition-colors shrink-0">
                <i class="fa-solid fa-folder-open text-base"></i>
                <span class="hidden sm:inline">Open EPUB</span>
                <input type="file" id="file-input" accept=".epub,.mobi,.azw3,.fb2,.cbz" class="hidden" />
            </label>

            <button id="btn-toggle-toc" class="p-2 sm:p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors flex items-center space-x-1 text-xs sm:text-sm font-medium" title="Table of Contents">
                <i class="fa-solid fa-book-open text-base"></i>
                <span class="hidden md:inline">TOC</span>
            </button>

            <button id="btn-open-search" class="p-2 sm:p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors flex items-center space-x-1 text-xs sm:text-sm font-medium" title="Search Book">
                <i class="fa-solid fa-magnifying-glass text-base"></i>
                <span class="hidden md:inline">Search</span>
            </button>
        </div>

        <!-- Middle Group: Title / Info Trigger -->
        <div class="relative flex items-center justify-center min-w-0 flex-1 max-w-md mx-2">
            <button id="btn-book-info" class="p-2 sm:py-2 sm:px-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors flex items-center space-x-2 max-w-full" title="Book Details & Metadata">
                <i class="fa-solid fa-circle-info text-lg sm:text-xl shrink-0"></i>
                <span id="toolbar-book-title" class="hidden sm:inline-block text-xs sm:text-sm font-medium truncate max-w-[180px] md:max-w-[280px] lg:max-w-[360px]">No book loaded</span>
            </button>

            <!-- Book Info Popover Menu -->
            <div id="info-overlay" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 z-50 text-xs sm:text-sm space-y-3 max-h-[80vh] overflow-y-auto">
                <div class="font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-2 flex items-center justify-between">
                    <span class="flex items-center space-x-2">
                        <i class="fa-solid fa-book-bookmark text-base"></i>
                        <span>Book Details</span>
                    </span>
                    <button id="btn-close-info" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>

                <div class="space-y-2.5 text-slate-600 dark:text-slate-300">
                    <div>
                        <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Title</span>
                        <p id="meta-title" class="font-semibold text-slate-800 dark:text-slate-100">No book loaded</p>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Author(s)</span>
                        <p id="meta-author" class="font-medium">--</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Publisher</span>
                            <p id="meta-publisher" class="font-medium">--</p>
                        </div>
                        <div>
                            <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Language</span>
                            <p id="meta-language" class="font-medium">--</p>
                        </div>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Subject / Category</span>
                        <p id="meta-subject" class="font-medium">--</p>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">Description</span>
                        <p id="meta-description" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed max-h-32 overflow-y-auto pt-1">--</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Group: Font Controls & Settings -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-0.5 mr-0.5 sm:mr-1">
                <button id="btn-font-dec" class="px-2.5 py-1.5 rounded bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-xs sm:text-sm transition-colors shadow-sm" title="Decrease Font Size">A-</button>
                <span id="font-size-label" class="px-1.5 sm:px-2 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 min-w-[3rem] sm:min-w-[3.5rem] text-center">100%</span>
                <button id="btn-font-inc" class="px-2.5 py-1.5 rounded bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-xs sm:text-sm transition-colors shadow-sm" title="Increase Font Size">A+</button>
            </div>

            <!-- Bookmarks Trigger -->
            <div class="relative">
                <button id="btn-bookmark" class="p-2 sm:p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors" title="Bookmarks">
                    <i class="fa-solid fa-bookmark text-base"></i>
                </button>

                <div id="bookmark-overlay" class="hidden absolute right-0 mt-2 w-72 sm:w-80 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-3.5 z-50 text-xs sm:text-sm">
                    <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-200 dark:border-slate-700">
                        <strong class="font-bold text-slate-700 dark:text-slate-200">Bookmarks</strong>
                        <button id="btn-add-bookmark" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-medium transition-colors">+ Add Current</button>
                    </div>
                    <ul id="bookmark-list" class="space-y-1 max-h-64 overflow-y-auto">
                        <li class="text-slate-400 italic text-center py-4">No bookmarks saved yet.</li>
                    </ul>
                </div>
            </div>

            <!-- Settings Popover -->
            <div class="relative">
                <button id="btn-settings" class="p-2 sm:p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors" title="Display & Typography Settings">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>

                <div id="settings-overlay" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 z-50 text-xs sm:text-sm space-y-4 max-h-[85vh] overflow-y-auto">
                    <div class="font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-2 flex items-center justify-between">
                        <span>Display & Typography Settings</span>
                        <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                            <i class="fa-solid fa-xmark text-base"></i>
                        </button>
                    </div>

                    <!-- Theme Selector -->
                    <div>
                        <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1.5">Theme</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                            <button id="btn-theme-light" class="flex items-center justify-center space-x-1 py-2 px-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition-colors font-medium text-xs">
                                <i class="fa-solid fa-sun text-xs text-amber-500"></i>
                                <span>Day</span>
                            </button>
                            <button id="btn-theme-cream" class="flex items-center justify-center space-x-1 py-2 px-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-amber-50/60 text-amber-900 dark:text-slate-200 hover:bg-amber-100/60 transition-colors font-medium text-xs">
                                <i class="fa-solid fa-feather text-xs text-amber-700"></i>
                                <span>Cream</span>
                            </button>
                            <button id="btn-theme-mint" class="flex items-center justify-center space-x-1 py-2 px-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-emerald-50/60 text-emerald-900 dark:text-slate-200 hover:bg-emerald-100/60 transition-colors font-medium text-xs">
                                <i class="fa-solid fa-leaf text-xs text-emerald-600"></i>
                                <span>Mint</span>
                            </button>
                            <button id="btn-theme-dark" class="flex items-center justify-center space-x-1 py-2 px-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700 transition-colors font-medium text-xs">
                                <i class="fa-solid fa-moon text-xs text-indigo-400"></i>
                                <span>Night</span>
                            </button>
                        </div>
                    </div>

                    <!-- Typography Options -->
                    <div>
                        <label for="select-font-family" class="block font-medium text-slate-600 dark:text-slate-300 mb-1.5">Font Typography</label>
                        <select id="select-font-family" class="w-full text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="publisher" selected>Publisher Default</option>
                            <option value="sans-serif">Sans-Serif (System UI)</option>
                            <option value="serif">Serif (Georgia / Times)</option>
                            <option value="monospace">Monospace (Code / Fixed)</option>
                        </select>
                    </div>

                    <div>
                        <label for="select-font-weight" class="block font-medium text-slate-600 dark:text-slate-300 mb-1.5">Font Weight</label>
                        <select id="select-font-weight" class="w-full text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="normal" selected>Normal (400)</option>
                            <option value="300">Light (300)</option>
                            <option value="500">Medium (500)</option>
                            <option value="600">Semi-Bold (600)</option>
                            <option value="bold">Bold (700)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label for="slider-line-height" class="font-medium text-slate-600 dark:text-slate-300">Line Height</label>
                                <span id="val-line-height" class="text-xs text-slate-400 font-mono">1.5</span>
                            </div>
                            <input type="range" id="slider-line-height" min="1.0" max="2.5" step="0.1" value="1.5" class="w-full accent-indigo-600 cursor-pointer h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none" />
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label for="slider-letter-spacing" class="font-medium text-slate-600 dark:text-slate-300">Spacing</label>
                                <span id="val-letter-spacing" class="text-xs text-slate-400 font-mono">0px</span>
                            </div>
                            <input type="range" id="slider-letter-spacing" min="-1" max="5" step="0.5" value="0" class="w-full accent-indigo-600 cursor-pointer h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none" />
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-100 dark:border-slate-700/50">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="font-medium text-slate-600 dark:text-slate-300">Fluid Typography <span class="text-xs text-slate-400 font-normal">(clamp())</span></span>
                            <input type="checkbox" id="toggle-fluid-type" class="sr-only peer" checked />
                            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-indigo-600 relative"></div>
                        </label>
                    </div>

                    <div>
                        <label for="select-flow" class="block font-medium text-slate-600 dark:text-slate-300 mb-1.5">Layout Mode</label>
                        <select id="select-flow" class="w-full text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="paginated">Paginated</option>
                            <option value="scrolled">Scrolled Continuous</option>
                        </select>
                    </div>

                    <div>
                        <label for="select-dir" class="block font-medium text-slate-600 dark:text-slate-300 mb-1.5">Reading Direction</label>
                        <select id="select-dir" class="w-full text-xs sm:text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="ltr">Horizontal (LTR)</option>
                            <option value="vertical">Vertical</option>
                        </select>
                    </div>

                </div>
            </div>

        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div id="main-container" class="relative flex-1 flex overflow-hidden">

        <!-- LOADING OVERLAY -->
        <div id="loading-overlay" class="absolute inset-0 bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center z-40 gap-3 text-sm text-slate-600 dark:text-slate-300 p-4 text-center">
            <div id="loading-spinner" class="spinner hidden"></div>
            <span id="loading-text" class="font-medium">Please select an EPUB file to begin reading.</span>
        </div>

        <!-- TOC SIDEBAR -->
        <aside id="toc-sidebar" class="sidebar-transition absolute left-0 top-0 bottom-0 w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-30 transform -translate-x-full flex flex-col shadow-2xl">
            <div class="flex justify-between items-center p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <strong class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Table of Contents</strong>
                <button id="btn-close-toc" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-3">
                <ul id="toc-list" class="space-y-1 text-xs sm:text-sm"></ul>
            </div>
        </aside>

        <!-- SEARCH SIDEBAR -->
        <aside id="search-sidebar" class="sidebar-transition absolute left-0 top-0 bottom-0 w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-30 transform -translate-x-full flex flex-col shadow-2xl">
            <div class="flex justify-between items-center p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <strong id="search-count-header" class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Search Results</strong>
                <button id="btn-close-search" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-3 border-b border-slate-200 dark:border-slate-800">
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="Search book text..." class="flex-1 px-3 py-2 border border-slate-200 dark:border-slate-700 dark:bg-slate-800 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                    <button id="btn-search" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg transition-colors">Search</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-3">
                <ul id="search-results" class="space-y-2 text-xs sm:text-sm"></ul>
            </div>
        </aside>

        <!-- NAV ARROWS -->
        <button id="btn-prev" class="absolute left-2 top-1/2 -translate-y-1/2 z-10 p-3 bg-slate-900/10 dark:bg-slate-100/10 opacity-10 hover:opacity-50 active:opacity-60 text-slate-900 dark:text-slate-100 rounded-full shadow-md backdrop-blur-sm transition-opacity border border-slate-500/20 flex items-center justify-center w-10 h-10" title="Previous Page">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>
        <button id="btn-next" class="absolute right-2 top-1/2 -translate-y-1/2 z-10 p-3 bg-slate-900/10 dark:bg-slate-100/10 opacity-10 hover:opacity-50 active:opacity-60 text-slate-900 dark:text-slate-100 rounded-full shadow-md backdrop-blur-sm transition-opacity border border-slate-500/20 flex items-center justify-center w-10 h-10" title="Next Page">
            <i class="fa-solid fa-chevron-right text-lg"></i>
        </button>

        <!-- READER CANVAS VIEWPORT -->
        <main class="flex-1 h-full w-full relative">
            <foliate-view id="view" tabindex="0"></foliate-view>
        </main>
    </div>

    <!-- FOOTER -->
    <footer id="footer" class="min-h-[2.75rem] bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-4 flex items-center justify-between gap-2 sm:gap-3 text-xs sm:text-sm z-10 shrink-0">
        <input type="range" id="progress-slider" min="0" max="1" step="0.0001" value="0" class="flex-1 accent-indigo-600 cursor-pointer h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none" />
        <span id="page-info" class="text-slate-500 dark:text-slate-400 font-mono whitespace-nowrap shrink-0 text-right">0%</span>
    </footer>

    <!-- LOGIC MODULE -->
    <script type="module">
        const view = document.getElementById('view');
        const fileInput = document.getElementById('file-input');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingText = document.getElementById('loading-text');

        const tocSidebar = document.getElementById('toc-sidebar');
        const searchSidebar = document.getElementById('search-sidebar');
        const tocList = document.getElementById('toc-list');
        const resultsList = document.getElementById('search-results');
        const searchCountHeader = document.getElementById('search-count-header');

        const selectFlow = document.getElementById('select-flow');
        const selectDir = document.getElementById('select-dir');
        const selectFontFamily = document.getElementById('select-font-family');
        const selectFontWeight = document.getElementById('select-font-weight');
        const sliderLineHeight = document.getElementById('slider-line-height');
        const sliderLetterSpacing = document.getElementById('slider-letter-spacing');
        const toggleFluidType = document.getElementById('toggle-fluid-type');
        const valLineHeight = document.getElementById('val-line-height');
        const valLetterSpacing = document.getElementById('val-letter-spacing');

        const progressSlider = document.getElementById('progress-slider');
        const pageInfo = document.getElementById('page-info');

        const btnBookmark = document.getElementById('btn-bookmark');
        const bookmarkOverlay = document.getElementById('bookmark-overlay');
        const btnAddBookmark = document.getElementById('btn-add-bookmark');
        const bookmarkList = document.getElementById('bookmark-list');

        const btnSettings = document.getElementById('btn-settings');
        const settingsOverlay = document.getElementById('settings-overlay');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        
        const btnThemeLight = document.getElementById('btn-theme-light');
        const btnThemeCream = document.getElementById('btn-theme-cream');
        const btnThemeMint = document.getElementById('btn-theme-mint');
        const btnThemeDark = document.getElementById('btn-theme-dark');

        const btnBookInfo = document.getElementById('btn-book-info');
        const toolbarBookTitle = document.getElementById('toolbar-book-title');
        const infoOverlay = document.getElementById('info-overlay');
        const btnCloseInfo = document.getElementById('btn-close-info');
        const metaTitle = document.getElementById('meta-title');
        const metaAuthor = document.getElementById('meta-author');
        const metaPublisher = document.getElementById('meta-publisher');
        const metaLanguage = document.getElementById('meta-language');
        const metaSubject = document.getElementById('meta-subject');
        const metaDescription = document.getElementById('meta-description');

        let currentFontSize = 100;
        let currentTheme = 'light'; // Default to Day theme
        let currentBookKey = null;
        let currentLocation = null;
        const tocItemToElementMap = new Map();

        // -------------------------------------------------------------
        // 1. INITIALIZATION & EPUB LOADING
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', async () => {
            await customElements.whenDefined('foliate-view');

            const urlParams = new URLSearchParams(window.location.search);
            const bookParam = urlParams.get('book');

            if (bookParam) {
                await openBookSource(`./books/${bookParam}`);
            } else {
                loadingSpinner.classList.add('hidden');
                loadingText.textContent = "Please select an EPUB file using 'Open EPUB' to start reading.";
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                await openBookSource(file);
            }
        });

        function showLoading(msg) {
            loadingOverlay.style.display = 'flex';
            loadingSpinner.classList.remove('hidden');
            loadingText.textContent = msg || 'Loading book...';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        async function openBookSource(source) {
            showLoading(typeof source === 'string' ? `Fetching ${source.split('/').pop()}...` : 'Opening file...');
            try {
                await view.open(source);

                const bookObj = view.book;
                
                const parseMetaField = (val) => {
                    if (!val) return 'Unknown';
                    if (typeof val === 'string') return val;
                    if (Array.isArray(val)) {
                        return val.map(item => typeof item === 'string' ? item : (item.name || item.en || JSON.stringify(item))).join(', ');
                    }
                    if (typeof val === 'object') {
                        return val.name || val.en || Object.values(val)[0] || 'Unknown';
                    }
                    return String(val);
                };

                const bookTitle = parseMetaField(bookObj?.metadata?.title) || (source.name || 'loaded_book');

                currentBookKey = `foliate_saved_${bookTitle}`;
                document.title = `${bookTitle} - EPUB Reader`;

                toolbarBookTitle.textContent = bookTitle;

                metaTitle.textContent = bookTitle;
                metaAuthor.textContent = parseMetaField(bookObj?.metadata?.creator || bookObj?.metadata?.author);
                metaPublisher.textContent = parseMetaField(bookObj?.metadata?.publisher);
                metaLanguage.textContent = parseMetaField(bookObj?.metadata?.language);
                metaSubject.textContent = parseMetaField(bookObj?.metadata?.subject);

                const rawDesc = parseMetaField(bookObj?.metadata?.description);
                const cleanDesc = rawDesc !== 'Unknown' ? rawDesc.replace(/<[^>]*>?/gm, '') : 'No description available for this book.';
                metaDescription.textContent = cleanDesc;

                loadSavedSettings();
                updateLayoutConfig();

                if (bookObj && bookObj.toc) {
                    renderTOC(bookObj.toc);
                }

                applyStyles();

                const savedCfi = localStorage.getItem(`${currentBookKey}_last_read`);
                if (savedCfi) {
                    await view.goTo(savedCfi);
                } else {
                    await skipBlankInitialPages();
                }

                renderBookmarks();
                attachIframeKeyListeners();
                hideLoading();
            } catch (err) {
                console.error("Error opening book source:", err);
                loadingSpinner.classList.add('hidden');
                loadingText.textContent = "Could not open EPUB file. Please ensure local server is running and the file is valid.";
            }
        }

        async function skipBlankInitialPages() {
            let attempts = 0;
            const maxAttempts = 3;

            while (attempts < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 150));

                const iframes = view.shadowRoot 
                    ? view.shadowRoot.querySelectorAll('iframe') 
                    : view.querySelectorAll('iframe');

                let hasValidContent = false;

                iframes.forEach(iframe => {
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow?.document;
                        if (doc && doc.body) {
                            const textContent = (doc.body.innerText || doc.body.textContent || '').trim();
                            const hasGraphics = doc.body.querySelectorAll('img, svg, image, picture, canvas').length > 0;
                            const bodyHTML = doc.body.innerHTML.toLowerCase();
                            const isTitlePage = 
                                bodyHTML.includes('titlepage') || 
                                bodyHTML.includes('epub-cover') || 
                                doc.querySelector('[aria-label*="cover" i], [id*="cover" i], [class*="cover" i], [id*="title" i], [class*="title" i]') !== null;

                            if (textContent.length > 0 || hasGraphics || isTitlePage) {
                                hasValidContent = true;
                            }
                        }
                    } catch (e) {
                        hasValidContent = true; 
                    }
                });

                if (hasValidContent) break;

                attempts++;
                if (view.next) {
                    await view.next();
                } else if (view.goRight) {
                    await view.goRight();
                }
            }
        }

        // -------------------------------------------------------------
        // 2. LAYOUT & TYPOGRAPHY STYLING
        // -------------------------------------------------------------
        function loadSavedSettings() {
            if (!currentBookKey) return;
            const savedSettings = JSON.parse(localStorage.getItem(`${currentBookKey}_settings`) || 'null');

            if (savedSettings) {
                currentFontSize = savedSettings.fontSize ?? 100;
                selectFontFamily.value = savedSettings.fontFamily ?? 'publisher';
                selectFontWeight.value = savedSettings.fontWeight ?? 'normal';
                sliderLineHeight.value = savedSettings.lineHeight ?? 1.5;
                sliderLetterSpacing.value = savedSettings.letterSpacing ?? 0;
                toggleFluidType.checked = savedSettings.fluidType ?? true;
                selectFlow.value = savedSettings.flow ?? 'paginated';
                selectDir.value = savedSettings.dir ?? 'ltr';
                
                let themeToLoad = savedSettings.theme ?? 'light';
                if (themeToLoad === 'sepia') themeToLoad = 'cream';
                setTheme(themeToLoad);
            } else {
                currentFontSize = 100;
                selectFontFamily.value = 'publisher';
                selectFontWeight.value = 'normal';
                sliderLineHeight.value = 1.5;
                sliderLetterSpacing.value = 0;
                toggleFluidType.checked = true;
                selectFlow.value = 'paginated';
                selectDir.value = 'ltr';
                setTheme('light');
            }
            document.getElementById('font-size-label').textContent = `${currentFontSize}%`;
        }

        function saveCurrentSettings() {
            if (!currentBookKey) return;
            const settings = {
                fontSize: currentFontSize,
                fontFamily: selectFontFamily.value,
                fontWeight: selectFontWeight.value,
                lineHeight: sliderLineHeight.value,
                letterSpacing: sliderLetterSpacing.value,
                fluidType: toggleFluidType.checked,
                flow: selectFlow.value,
                dir: selectDir.value,
                theme: currentTheme
            };
            localStorage.setItem(`${currentBookKey}_settings`, JSON.stringify(settings));
        }

        function updateLayoutConfig() {
            if (!view) return;
            const flow = selectFlow.value;
            const dir = selectDir.value;

            view.setAttribute('flow', flow);
            view.setAttribute('dir', dir);

            if (view.renderer) {
                view.renderer.setAttribute('flow', flow === 'scrolled' ? 'scrolled' : 'paginated');
                view.renderer.setAttribute('writing-mode', dir === 'vertical' ? 'vertical-rl' : 'horizontal-tb');
            }
            saveCurrentSettings();
        }

        selectFlow.addEventListener('change', updateLayoutConfig);
        selectDir.addEventListener('change', updateLayoutConfig);

        function applyStyles() {
            if (!view) return;

            const chosenFont = selectFontFamily.value;
            const chosenWeight = selectFontWeight.value;
            const lineHeight = sliderLineHeight.value;
            const letterSpacing = sliderLetterSpacing.value;
            const isFluid = toggleFluidType.checked;

            valLineHeight.textContent = lineHeight;
            valLetterSpacing.textContent = `${letterSpacing}px`;

            let fontFamilyCss = chosenFont !== 'publisher' ? `font-family: ${chosenFont}, Georgia, serif !important;` : '';
            
            let fontSizeCss = `font-size: ${currentFontSize}% !important;`;
            if (isFluid) {
                const basePx = (16 * (currentFontSize / 100)).toFixed(1);
                const minPx = (basePx * 0.85).toFixed(1);
                const maxPx = (basePx * 1.25).toFixed(1);
                fontSizeCss = `font-size: clamp(${minPx}px, ${basePx * 0.8}px + 1vw, ${maxPx}px) !important;`;
            }

            let bgHex = '#ffffff';
            let textHex = '#333333';
            let headingHex = '#111827';
            let linkHex = '#2563eb';
            let selectionHex = '#bfdbfe';

            if (currentTheme === 'dark') {
                bgHex = '#0f172a';
                textHex = '#f1f5f9';
                headingHex = '#ffffff';
                linkHex = '#60a5fa';
                selectionHex = '#3b82f6';
            } else if (currentTheme === 'cream') {
                bgHex = '#fcf9f2';
                textHex = '#433831';
                headingHex = '#2c221e';
                linkHex = '#8c4a32';
                selectionHex = '#fde68a';
            } else if (currentTheme === 'mint') {
                bgHex = '#eaf4f0';
                textHex = '#1e3a31';
                headingHex = '#102620';
                linkHex = '#1b6b4a';
                selectionHex = '#a7f3d0';
            }

            const themeCSS = `
                body, p, div, span {
                    ${fontSizeCss}
                    ${fontFamilyCss}
                    font-weight: ${chosenWeight} !important;
                    line-height: ${lineHeight} !important;
                    letter-spacing: ${letterSpacing}px !important;
                    background-color: ${bgHex} !important;
                    color: ${textHex} !important;
                }
                h1, h2, h3, h4, h5, h6 {
                    ${fontFamilyCss}
                    color: ${headingHex} !important;
                    font-weight: 700 !important;
                }
                a {
                    color: ${linkHex} !important;
                }
                ::selection {
                    background: ${selectionHex};
                }
            `;

            if (view.renderer && view.renderer.setStyles) {
                view.renderer.setStyles(themeCSS);
            }

            saveCurrentSettings();
        }

        selectFontFamily.addEventListener('change', applyStyles);
        selectFontWeight.addEventListener('change', applyStyles);
        sliderLineHeight.addEventListener('input', applyStyles);
        sliderLetterSpacing.addEventListener('input', applyStyles);
        toggleFluidType.addEventListener('change', applyStyles);

        document.getElementById('btn-font-inc').addEventListener('click', () => {
            currentFontSize += 10;
            document.getElementById('font-size-label').textContent = `${currentFontSize}%`;
            applyStyles();
        });

        document.getElementById('btn-font-dec').addEventListener('click', () => {
            if (currentFontSize > 50) {
                currentFontSize -= 10;
                document.getElementById('font-size-label').textContent = `${currentFontSize}%`;
                applyStyles();
            }
        });

        function setTheme(themeMode) {
            currentTheme = themeMode;

            document.documentElement.classList.remove('dark', 'sepia', 'cream', 'mint');
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (currentTheme === 'cream') {
                document.documentElement.classList.add('cream');
            } else if (currentTheme === 'mint') {
                document.documentElement.classList.add('mint');
            }

            const buttons = { light: btnThemeLight, cream: btnThemeCream, mint: btnThemeMint, dark: btnThemeDark };
            Object.keys(buttons).forEach(mode => {
                const btn = buttons[mode];
                if (btn) {
                    if (mode === currentTheme) {
                        btn.classList.add('ring-2', 'ring-indigo-500', 'font-bold');
                    } else {
                        btn.classList.remove('ring-2', 'ring-indigo-500', 'font-bold');
                    }
                }
            });

            applyStyles();
        }

        btnThemeLight.addEventListener('click', () => setTheme('light'));
        btnThemeCream.addEventListener('click', () => setTheme('cream'));
        btnThemeMint.addEventListener('click', () => setTheme('mint'));
        btnThemeDark.addEventListener('click', () => setTheme('dark'));

        // Popovers
        btnSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            bookmarkOverlay.classList.add('hidden');
            infoOverlay.classList.add('hidden');
            settingsOverlay.classList.toggle('hidden');
        });

        btnCloseSettings.addEventListener('click', () => {
            settingsOverlay.classList.add('hidden');
        });

        btnBookInfo.addEventListener('click', (e) => {
            e.stopPropagation();
            bookmarkOverlay.classList.add('hidden');
            settingsOverlay.classList.add('hidden');
            infoOverlay.classList.toggle('hidden');
        });

        btnCloseInfo.addEventListener('click', () => {
            infoOverlay.classList.add('hidden');
        });

        // -------------------------------------------------------------
        // 3. KEYBOARD & FLANK NAVIGATION
        // -------------------------------------------------------------
        document.getElementById('btn-prev').addEventListener('click', () => view.goLeft());
        document.getElementById('btn-next').addEventListener('click', () => view.goRight());

        function handleKeyDown(e) {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                view.goLeft();
            } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                e.preventDefault();
                view.goRight();
            }
        }

        window.addEventListener('keydown', handleKeyDown);

        function attachIframeKeyListeners() {
            setTimeout(() => {
                const iframes = view.shadowRoot ? view.shadowRoot.querySelectorAll('iframe') : view.querySelectorAll('iframe');
                iframes.forEach(iframe => {
                    try {
                        iframe.contentWindow?.removeEventListener('keydown', handleKeyDown);
                        iframe.contentWindow?.addEventListener('keydown', handleKeyDown);
                    } catch (e) {}
                });
            }, 300);
        }

        // -------------------------------------------------------------
        // 4. TOC & SIDEBARS
        // -------------------------------------------------------------
        function renderTOC(tocItems) {
            tocList.innerHTML = '';
            tocItemToElementMap.clear();

            if (!tocItems || tocItems.length === 0) {
                tocList.innerHTML = '<li class="text-slate-400 italic">No Table of Contents found.</li>';
                return;
            }

            function appendTocNodes(nodes, container) {
                nodes.forEach(node => {
                    const li = document.createElement('li');
                    li.className = 'py-2 px-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors text-slate-700 dark:text-slate-300';
                    li.textContent = node.label ? node.label.trim() : 'Chapter';
                    tocItemToElementMap.set(node, li);

                    li.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (node.href) view.goTo(node.href);
                        if (window.innerWidth < 768) closeSidebars();
                    });

                    container.appendChild(li);

                    if (node.subitems && node.subitems.length > 0) {
                        const nestedUl = document.createElement('ul');
                        nestedUl.className = 'pl-3 mt-1 space-y-1 border-l border-slate-200 dark:border-slate-800';
                        appendTocNodes(node.subitems, nestedUl);
                        container.appendChild(nestedUl);
                    }
                });
            }

            appendTocNodes(tocItems, tocList);
        }

        function syncTOC(tocItem) {
            if (!tocItem) return;
            tocList.querySelectorAll('li').forEach(el => el.classList.remove('font-bold', 'text-indigo-600', 'bg-indigo-50', 'dark:bg-slate-800'));

            const activeLi = tocItemToElementMap.get(tocItem);
            if (activeLi) {
                activeLi.classList.add('font-bold', 'text-indigo-600', 'bg-indigo-50', 'dark:bg-slate-800');
                activeLi.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function closeSidebars() {
            tocSidebar.classList.add('-translate-x-full');
            searchSidebar.classList.add('-translate-x-full');
        }

        document.getElementById('btn-toggle-toc').addEventListener('click', () => {
            searchSidebar.classList.add('-translate-x-full');
            tocSidebar.classList.toggle('-translate-x-full');
        });

        document.getElementById('btn-open-search').addEventListener('click', () => {
            tocSidebar.classList.add('-translate-x-full');
            searchSidebar.classList.toggle('-translate-x-full');
        });

        document.getElementById('btn-close-toc').addEventListener('click', closeSidebars);
        document.getElementById('btn-close-search').addEventListener('click', closeSidebars);

        view.addEventListener('relocate', (e) => {
            attachIframeKeyListeners();
            const { detail } = e;
            const { fraction, location, total, tocItem, cfi } = detail;

            if (tocItem) syncTOC(tocItem);

            if (fraction !== undefined) progressSlider.value = fraction;
            const current = location?.current ?? 0;
            const totalPages = total ?? 0;
            const pct = Math.round((fraction || 0) * 100);

            if (totalPages > 0) {
                pageInfo.textContent = `Page ${current} of ${totalPages} (${pct}%)`;
            } else if (current > 0) {
                pageInfo.textContent = `Page ${current} (${pct}%)`;
            } else {
                pageInfo.textContent = `${pct}%`;
            }

            currentLocation = {
                cfi,
                chapterTitle: tocItem?.label || 'Current Section',
                percentage: pct
            };

            if (cfi && currentBookKey) {
                localStorage.setItem(`${currentBookKey}_last_read`, cfi);
            }
        });

        progressSlider.addEventListener('change', (e) => {
            const fraction = parseFloat(e.target.value);
            if (view) view.goToFraction(fraction);
        });

        // -------------------------------------------------------------
        // 5. BOOKMARKS OVERLAY & GLOBAL POPOVER CLOSE
        // -------------------------------------------------------------
        function getSavedBookmarks() {
            if (!currentBookKey) return [];
            return JSON.parse(localStorage.getItem(`${currentBookKey}_bookmarks`) || '[]');
        }

        function saveBookmarks(bookmarks) {
            if (!currentBookKey) return;
            localStorage.setItem(`${currentBookKey}_bookmarks`, JSON.stringify(bookmarks));
        }

        function renderBookmarks() {
            bookmarkList.innerHTML = '';
            const bookmarks = getSavedBookmarks();

            if (bookmarks.length === 0) {
                bookmarkList.innerHTML = '<li class="text-slate-400 italic text-center py-4">No bookmarks saved yet.</li>';
                return;
            }

            bookmarks.forEach((bm, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700/50 cursor-pointer transition-colors border-b border-slate-100 dark:border-slate-800';
                const metaText = `${bm.percentage !== null ? bm.percentage + '% · ' : ''}${new Date(bm.timestamp).toLocaleDateString()}`;

                li.innerHTML = `
                    <div class="bookmark-info flex-1 min-w-0 mr-2">
                        <p class="font-semibold text-slate-700 dark:text-slate-200 truncate">${bm.chapterTitle}</p>
                        <p class="text-[10px] text-slate-400">${metaText}</p>
                    </div>
                    <button class="btn-remove-bm text-red-500 hover:text-red-700 p-1 text-sm">&times;</button>
                `;

                li.querySelector('.bookmark-info').addEventListener('click', () => {
                    view.goTo(bm.cfi);
                    bookmarkOverlay.classList.add('hidden');
                });

                li.querySelector('.btn-remove-bm').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const updated = getSavedBookmarks();
                    updated.splice(index, 1);
                    saveBookmarks(updated);
                    renderBookmarks();
                });

                bookmarkList.appendChild(li);
            });
        }

        btnBookmark.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!currentBookKey) {
                alert('Please load an EPUB file first.');
                return;
            }
            settingsOverlay.classList.add('hidden');
            infoOverlay.classList.add('hidden');
            bookmarkOverlay.classList.toggle('hidden');
        });

        btnAddBookmark.addEventListener('click', () => {
            if (!currentLocation || !currentLocation.cfi) return;
            const bookmarks = getSavedBookmarks();
            if (bookmarks.some(b => b.cfi === currentLocation.cfi)) return;

            bookmarks.unshift({
                cfi: currentLocation.cfi,
                chapterTitle: currentLocation.chapterTitle,
                percentage: currentLocation.percentage,
                timestamp: Date.now()
            });

            saveBookmarks(bookmarks);
            renderBookmarks();
        });

        document.addEventListener('click', (e) => {
            if (!bookmarkOverlay.contains(e.target) && !btnBookmark.contains(e.target)) {
                bookmarkOverlay.classList.add('hidden');
            }
            if (!settingsOverlay.contains(e.target) && !btnSettings.contains(e.target)) {
                settingsOverlay.classList.add('hidden');
            }
            if (!infoOverlay.contains(e.target) && !btnBookInfo.contains(e.target)) {
                infoOverlay.classList.add('hidden');
            }
        });

        // -------------------------------------------------------------
        // 6. SEARCH ENGINE
        // -------------------------------------------------------------
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('btn-search');

        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            if (!view.book) {
                alert('Please load an EPUB file before searching.');
                return;
            }

            tocSidebar.classList.add('-translate-x-full');
            searchSidebar.classList.remove('-translate-x-full');
            resultsList.innerHTML = '';
            searchCountHeader.textContent = 'Searching...';

            let matchCount = 0;

            try {
                const searchGen = view.search(query);
                if (searchGen) {
                    for await (const result of searchGen) {
                        const matches = result.subitems || result.results || (Array.isArray(result) ? result : []);
                        for (const item of matches) {
                            matchCount++;
                            appendSearchResult(
                                item.excerpt || item.text || query,
                                item.cfi || item.href,
                                result.label || `Match ${matchCount}`,
                                query
                            );
                        }
                    }
                }

                if (matchCount === 0) {
                    searchCountHeader.textContent = 'Search Results';
                    resultsList.innerHTML = '<li class="p-2 text-slate-400 italic">No results found.</li>';
                } else {
                    searchCountHeader.textContent = `Found ${matchCount} matches`;
                }

            } catch (err) {
                console.error("Search Error:", err);
                searchCountHeader.textContent = 'Search Error';
                resultsList.innerHTML = '<li class="p-2 text-red-500">Error executing search.</li>';
            }
        }

        function appendSearchResult(snippet, target, label, query) {
            const li = document.createElement('li');
            li.className = 'p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer border-b border-slate-100 dark:border-slate-800 transition-colors';
            
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const highlightedText = snippet.replace(new RegExp(`(${escapedQuery})`, 'gi'), '<mark>$1</mark>');

            li.innerHTML = `
                <div class="font-semibold text-xs mb-1 text-indigo-600 dark:text-indigo-400 truncate">${label}</div>
                <div class="text-slate-600 dark:text-slate-300 leading-relaxed text-xs sm:text-sm">...${highlightedText}...</div>
            `;

            li.addEventListener('click', () => {
                if (target !== undefined) view.goTo(target);
                if (window.innerWidth < 768) closeSidebars();
            });

            resultsList.appendChild(li);
        }

        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                executeSearch();
            }
        });
    </script>
</body>
</html>
