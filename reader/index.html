<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-Book Reader - Translated Library</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                screens: {
                    'xs': '400px',
                    'sm': '640px',
                    'md': '768px',
                    'lg': '1024px',
                    'xl': '1280px',
                },
                extend: {
                    colors: {
                        polyu: {
                            red: '#9E1B32',      /* PolyU Crimson Red */
                            redhover: '#821326',
                            dark: '#1A202C',
                            gray: '#718096',
                            lightbg: '#F8F9FA'
                        },
                        cream: {
                            50: '#fcf9f2',
                            100: '#f5efe6',
                            200: '#e6dcce',
                            700: '#8c4a32',
                            800: '#433831',
                            900: '#2c221e',
                        },
                        mint: {
                            50: '#eaf4f0',
                            100: '#dbece5',
                            200: '#bfded2',
                            700: '#1b6b4a',
                            800: '#1e3a31',
                            900: '#102620',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icon Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- External Shared Common Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Import Local Foliate JS Web Component -->
    <script type="module" src="./foliate-js/view.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col font-sans antialiased overflow-hidden transition-colors duration-200 select-none text-base selection:bg-polyu-red selection:text-white">
    <!-- TOP TOOLBAR -->
    <header id="toolbar" class="min-h-[3.5rem] sm:min-h-[4rem] border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur flex items-center justify-between px-2 sm:px-4 z-30 shrink-0 gap-1 sm:gap-3 w-full relative">
        
        <!-- Left Group: Back Button, TOC & Search -->
        <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
            <!-- Back Button going to previous page or library.html -->
            <button id="btn-back" onclick="goBackToLibrary()" class="inline-flex items-center gap-1 px-2.5 py-1.5 sm:px-3.5 sm:py-2 bg-polyu-red hover:bg-polyu-redhover text-white text-xs sm:text-sm font-bold rounded shadow-sm transition-colors shrink-0">
                <i class="fa-solid fa-arrow-left text-xs sm:text-sm"></i>
                <span>Back</span>
            </button>
            <!-- TOC Button -->
            <button id="btn-toggle-toc" class="p-1.5 sm:p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors inline-flex items-center gap-1 text-xs sm:text-base font-bold" title="Table of Contents">
                <i class="fa-solid fa-book-open text-base sm:text-lg text-polyu-red dark:text-red-400"></i>
                <span class="hidden md:inline">TOC</span>
            </button>
            <!-- Search Button -->
            <button id="btn-open-search" class="p-1.5 sm:p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors inline-flex items-center gap-1 text-xs sm:text-base font-bold" title="Search Book">
                <i class="fa-solid fa-magnifying-glass text-base sm:text-lg text-polyu-red dark:text-red-400"></i>
                <span class="hidden md:inline">Search</span>
            </button>
        </div>
        <!-- Middle Group: Book Title & Info Popover Trigger -->
        <div class="relative flex items-center justify-center shrink-0">
            <button id="btn-book-info" class="p-1.5 sm:py-2 sm:px-3 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors inline-flex items-center gap-1.5 max-w-full" title="Book Details & Metadata">
                <i class="fa-solid fa-circle-info text-base sm:text-xl text-polyu-red dark:text-red-400 shrink-0"></i>
                <span id="toolbar-book-title" class="hidden sm:inline-block text-xs sm:text-base font-bold truncate sm:max-w-[180px] md:max-w-[280px] lg:max-w-[360px]">Loading book...</span>
            </button>
            <!-- Book Info Popover Menu -->
            <div id="info-overlay" class="hidden fixed sm:absolute top-16 sm:top-full left-1/2 -translate-x-1/2 mt-2 w-[calc(100vw-2rem)] sm:w-[28rem] max-w-sm sm:max-w-lg bg-white dark:bg-slate-800 rounded-lg shadow-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-5 z-50 text-sm sm:text-base space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3 flex items-center justify-between text-base sm:text-lg">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-book-bookmark text-lg sm:text-xl text-polyu-red dark:text-red-400"></i>
                        <span>Book Details</span>
                    </span>
                    <button id="btn-close-info" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                        <i class="fa-solid fa-xmark text-lg sm:text-xl"></i>
                    </button>
                </div>
                <div class="space-y-3 text-slate-700 dark:text-slate-300">
                    <div>
                        <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Title</span>
                        <p id="meta-title" class="font-bold text-slate-800 dark:text-slate-100 text-base sm:text-lg">--</p>
                    </div>
                    <div>
                        <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Author(s)</span>
                        <p id="meta-author" class="font-medium text-sm sm:text-base">--</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Publisher</span>
                            <p id="meta-publisher" class="font-medium text-sm sm:text-base">--</p>
                        </div>
                        <div>
                            <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Language</span>
                            <p id="meta-language" class="font-medium text-sm sm:text-base">--</p>
                        </div>
                    </div>
                    <div>
                        <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Subject / Category</span>
                        <p id="meta-subject" class="font-medium text-sm sm:text-base">--</p>
                    </div>
                    <div>
                        <span class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-0.5">Description</span>
                        <p id="meta-description" class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed max-h-36 overflow-y-auto pt-1">--</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Right Group: A- A A+ Font Controls with Gradient Intensity -->
        <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
            
            <!-- Font Scale Controls: A- (70%), A (100%), A+ (140%) with Progressive Crimson Shades -->
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded p-0.5 space-x-1">
                <!-- A- (Small 70%): Light Crimson Tint -->
                <button id="btn-font-small" onclick="setFontScale(70)" class="px-2 py-1 rounded font-bold text-xs transition-all shadow-sm flex items-center justify-center min-w-[2rem]" title="Small Font (70%)">
                    A-
                </button>
                <!-- A (Medium 100%): Medium Crimson Tint -->
                <button id="btn-font-medium" onclick="setFontScale(100)" class="px-2 py-1 rounded font-bold text-sm transition-all shadow-sm flex items-center justify-center min-w-[2rem]" title="Normal Font (100%)">
                    A
                </button>
                <!-- A+ (Large 140%): Solid PolyU Crimson -->
                <button id="btn-font-large" onclick="setFontScale(140)" class="px-2.5 py-1 rounded font-bold text-base transition-all shadow-sm flex items-center justify-center min-w-[2.25rem]" title="Large Font (140%)">
                    A+
                </button>
            </div>
            <!-- Bookmark Button & Popover -->
            <div class="relative">
                <button id="btn-bookmark" class="p-1.5 sm:p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors inline-flex items-center" title="Bookmarks">
                    <i class="fa-solid fa-bookmark text-base sm:text-lg text-polyu-red dark:text-red-400"></i>
                </button>
                <div id="bookmark-overlay" class="hidden absolute right-0 mt-2 w-72 sm:w-80 bg-white dark:bg-slate-800 rounded-lg shadow-2xl border border-slate-200 dark:border-slate-700 p-3.5 z-50 text-xs sm:text-sm">
                    <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-200 dark:border-slate-700">
                        <strong class="font-bold text-slate-800 dark:text-slate-100 text-base sm:text-lg">Bookmarks</strong>
                        <button id="btn-add-bookmark" class="px-3 py-1.5 bg-polyu-red hover:bg-polyu-redhover text-white rounded text-xs sm:text-sm font-bold transition-colors">+ Add Current</button>
                    </div>
                    <ul id="bookmark-list" class="space-y-1.5 max-h-72 overflow-y-auto">
                        <li class="text-slate-400 italic text-center py-4">No bookmarks saved yet.</li>
                    </ul>
                </div>
            </div>
            <!-- Display Settings Button & Popover -->
            <div class="relative">
                <button id="btn-settings" class="p-1.5 sm:p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors inline-flex items-center" title="Display & Typography Settings">
                    <i class="fa-solid fa-gear text-base sm:text-lg text-polyu-red dark:text-red-400"></i>
                </button>
                <div id="settings-overlay" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-lg shadow-2xl border border-slate-200 dark:border-slate-700 p-4 z-50 text-xs sm:text-sm space-y-4 max-h-[85vh] overflow-y-auto">
                    <div class="font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3 flex items-center justify-between text-base sm:text-lg">
                        <span>Display & Typography Settings</span>
                        <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                            <i class="fa-solid fa-xmark text-lg sm:text-xl"></i>
                        </button>
                    </div>
                    <!-- Theme Selector -->
                    <div>
                        <label class="block font-bold text-slate-700 dark:text-slate-200 mb-2">Theme</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button id="btn-theme-light" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 hover:bg-slate-100 transition-colors font-medium text-xs sm:text-sm">
                                <i class="fa-solid fa-sun text-sm text-amber-500"></i>
                                <span>Day</span>
                            </button>
                            <button id="btn-theme-cream" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded border border-slate-200 dark:border-slate-700 bg-amber-50/60 text-amber-900 dark:text-slate-200 hover:bg-amber-100/60 transition-colors font-medium text-xs sm:text-sm">
                                <i class="fa-solid fa-feather text-sm text-amber-700"></i>
                                <span>Cream</span>
                            </button>
                            <button id="btn-theme-mint" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded border border-slate-200 dark:border-slate-700 bg-emerald-50/60 text-emerald-900 dark:text-slate-200 hover:bg-emerald-100/60 transition-colors font-medium text-xs sm:text-sm">
                                <i class="fa-solid fa-leaf text-sm text-emerald-600"></i>
                                <span>Mint</span>
                            </button>
                            <button id="btn-theme-dark" class="flex items-center justify-center gap-1.5 py-2.5 px-2 rounded border border-slate-200 dark:border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700 transition-colors font-medium text-xs sm:text-sm">
                                <i class="fa-solid fa-moon text-sm text-indigo-400"></i>
                                <span>Night</span>
                            </button>
                        </div>
                    </div>
                    <!-- Typography Options -->
                    <div>
                        <label for="select-font-family" class="block font-bold text-slate-700 dark:text-slate-200 mb-2">Font Typography</label>
                        <select id="select-font-family" class="w-full text-xs sm:text-base bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-3 py-2 text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-polyu-red">
                            <option value="publisher" selected>Publisher Default</option>
                            <option value="sans-serif">Sans-Serif (System UI)</option>
                            <option value="serif">Serif (Georgia / Times)</option>
                            <option value="monospace">Monospace (Code / Fixed)</option>
                        </select>
                    </div>
                    <div>
                        <label for="select-font-weight" class="block font-bold text-slate-700 dark:text-slate-200 mb-2">Font Weight</label>
                        <select id="select-font-weight" class="w-full text-sm sm:text-base bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-3.5 py-2 text-slate-800 dark:text-slate-200 outline-none focus:ring-2 focus:ring-polyu-red">
                            <option value="normal" selected>Normal (400)</option>
                            <option value="300">Light (300)</option>
                            <option value="500">Medium (500)</option>
                            <option value="600">Semi-Bold (600)</option>
                            <option value="bold">Bold (700)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label for="slider-line-height" class="font-bold text-slate-700 dark:text-slate-200 text-xs sm:text-sm">Line Height</label>
                                <span id="val-line-height" class="text-xs sm:text-sm text-slate-400 font-mono">1.5</span>
                            </div>
                            <input type="range" id="slider-line-height" min="1.0" max="2.5" step="0.1" value="1.5" class="w-full accent-polyu-red cursor-pointer h-2 bg-slate-200 dark:bg-slate-700 rounded appearance-none" />
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label for="slider-letter-spacing" class="font-bold text-slate-700 dark:text-slate-200 text-xs sm:text-sm">Spacing</label>
                                <span id="val-letter-spacing" class="text-xs sm:text-sm text-slate-400 font-mono">0px</span>
                            </div>
                            <input type="range" id="slider-letter-spacing" min="-1" max="5" step="0.5" value="0" class="w-full accent-polyu-red cursor-pointer h-2 bg-slate-200 dark:bg-slate-700 rounded appearance-none" />
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-700/50">
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="font-bold text-slate-700 dark:text-slate-200">Fluid Typography <span class="text-xs text-slate-400 font-normal">(clamp())</span></span>
                            <input type="checkbox" id="toggle-fluid-type" class="sr-only peer" checked />
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-polyu-red relative"></div>
                        </label>
                    </div>
                    <div>
                        <label for="select-flow" class="block font-bold text-slate-700 dark:text-slate-200 mb-2">Layout Mode</label>
                        <select id="select-flow" class="w-full text-sm sm:text-base bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-3.5 py-2 text-slate-800 dark:text-slate-200 outline-none focus:ring-2 focus:ring-polyu-red">
                            <option value="paginated">Paginated</option>
                            <option value="scrolled">Scrolled Continuous</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- MAIN CONTAINER -->
    <div id="main-container" class="relative flex-1 flex overflow-hidden">
        <!-- LOADING OVERLAY -->
        <div id="loading-overlay" class="absolute inset-0 bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center z-40 gap-4 text-base sm:text-lg text-slate-600 dark:text-slate-300 p-6 text-center">
            <div id="loading-spinner" class="spinner border-t-polyu-red border-polyu-red/20"></div>
            <span id="loading-text" class="font-bold">Opening reader...</span>
        </div>
        <!-- TOC SIDEBAR -->
        <aside id="toc-sidebar" class="sidebar-transition absolute left-0 top-0 bottom-0 w-80 sm:w-96 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-30 transform -translate-x-full flex flex-col shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <strong class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Table of Contents</strong>
                <button id="btn-close-toc" class="p-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <ul id="toc-list" class="space-y-1.5 text-sm sm:text-base font-medium"></ul>
            </div>
        </aside>
        <!-- SEARCH SIDEBAR -->
        <aside id="search-sidebar" class="sidebar-transition absolute left-0 top-0 bottom-0 w-80 sm:w-96 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-30 transform -translate-x-full flex flex-col shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                <strong id="search-count-header" class="text-xs sm:text-sm font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Search Results</strong>
                <button id="btn-close-search" class="p-2 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-4 border-b border-slate-200 dark:border-slate-800">
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="Search book text..." class="flex-1 px-3.5 py-2 border border-slate-200 dark:border-slate-700 dark:bg-slate-800 rounded text-sm sm:text-base focus:ring-2 focus:ring-polyu-red outline-none" />
                    <button id="btn-search" class="px-4 py-2 bg-polyu-red hover:bg-polyu-redhover text-white text-sm sm:text-base font-bold rounded transition-colors">Search</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <ul id="search-results" class="space-y-3 text-sm sm:text-base"></ul>
            </div>
        </aside>
        <!-- SIDE NAVIGATION BUTTONS -->
        <button id="btn-prev" class="absolute left-2 top-1/2 -translate-y-1/2 z-10 p-3 bg-slate-900/10 dark:bg-slate-100/10 opacity-10 hover:opacity-50 active:opacity-60 text-slate-900 dark:text-slate-100 rounded-full shadow-md backdrop-blur-sm transition-opacity border border-slate-500/20 flex items-center justify-center w-10 h-10" title="Previous Page">
            <i class="fa-solid fa-chevron-left text-base sm:text-xl"></i>
        </button>
        <button id="btn-next" class="absolute right-2 top-1/2 -translate-y-1/2 z-10 p-3 bg-slate-900/10 dark:bg-slate-100/10 opacity-10 hover:opacity-50 active:opacity-60 text-slate-900 dark:text-slate-100 rounded-full shadow-md backdrop-blur-sm transition-opacity border border-slate-500/20 flex items-center justify-center w-10 h-10" title="Next Page">
            <i class="fa-solid fa-chevron-right text-base sm:text-xl"></i>
        </button>
        <!-- READER CANVAS VIEWPORT -->
        <main class="flex-1 h-full w-full relative">
            <foliate-view id="view" tabindex="0"></foliate-view>
        </main>
    </div>
    <!-- FOOTER PROGRESS BAR -->
    <footer id="footer" class="min-h-[2.5rem] sm:min-h-[3rem] bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-3 sm:px-6 flex items-center justify-between gap-2 sm:gap-3 text-xs sm:text-base z-10 shrink-0">
        <input type="range" id="progress-slider" min="0" max="1" step="0.0001" value="0" class="flex-1 accent-polyu-red cursor-pointer h-2 bg-slate-200 dark:bg-slate-700 rounded appearance-none" />
        <span id="page-info" class="text-slate-600 dark:text-slate-300 font-mono font-bold whitespace-nowrap shrink-0 text-right">0%</span>
    </footer>
    <!-- LOGIC MODULE -->
    <script type="module">
        const view = document.getElementById('view');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingText = document.getElementById('loading-text');
        const tocSidebar = document.getElementById('toc-sidebar');
        const searchSidebar = document.getElementById('search-sidebar');
        const tocList = document.getElementById('toc-list');
        const resultsList = document.getElementById('search-results');
        const searchCountHeader = document.getElementById('search-count-header');
        const selectFlow = document.getElementById('select-flow');
        const selectFontFamily = document.getElementById('select-font-family');
        const selectFontWeight = document.getElementById('select-font-weight');
        const sliderLineHeight = document.getElementById('slider-line-height');
        const sliderLetterSpacing = document.getElementById('slider-letter-spacing');
        const toggleFluidType = document.getElementById('toggle-fluid-type');
        const valLineHeight = document.getElementById('val-line-height');
        const valLetterSpacing = document.getElementById('val-letter-spacing');
        const progressSlider = document.getElementById('progress-slider');
        const pageInfo = document.getElementById('page-info');
        const btnBookmark = document.getElementById('btn-bookmark');
        const bookmarkOverlay = document.getElementById('bookmark-overlay');
        const btnAddBookmark = document.getElementById('btn-add-bookmark');
        const bookmarkList = document.getElementById('bookmark-list');
        const btnSettings = document.getElementById('btn-settings');
        const settingsOverlay = document.getElementById('settings-overlay');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        
        const btnThemeLight = document.getElementById('btn-theme-light');
        const btnThemeCream = document.getElementById('btn-theme-cream');
        const btnThemeMint = document.getElementById('btn-theme-mint');
        const btnThemeDark = document.getElementById('btn-theme-dark');
        const btnBookInfo = document.getElementById('btn-book-info');
        const toolbarBookTitle = document.getElementById('toolbar-book-title');
        const infoOverlay = document.getElementById('info-overlay');
        const btnCloseInfo = document.getElementById('btn-close-info');
        const metaTitle = document.getElementById('meta-title');
        const metaAuthor = document.getElementById('meta-author');
        const metaPublisher = document.getElementById('meta-publisher');
        const metaLanguage = document.getElementById('meta-language');
        const metaSubject = document.getElementById('meta-subject');
        const metaDescription = document.getElementById('meta-description');
        let currentFontSize = 100;
        let currentTheme = 'light';

        document.addEventListener('click', (e) => {
            if (!bookmarkOverlay.contains(e.target) && !btnBookmark.contains(e.target)) {
                bookmarkOverlay.classList.add('hidden');
            }
            if (!settingsOverlay.contains(e.target) && !btnSettings.contains(e.target)) {
                settingsOverlay.classList.add('hidden');
            }
            if (!infoOverlay.contains(e.target) && !btnBookInfo.contains(e.target)) {
                infoOverlay.classList.add('hidden');
            }
        });
        // -------------------------------------------------------------
        // 6. SEARCH ENGINE
        // -------------------------------------------------------------
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('btn-search');
        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            if (!view.book) return;
            tocSidebar.classList.add('-translate-x-full');
            searchSidebar.classList.remove('-translate-x-full');
            resultsList.innerHTML = '';
            searchCountHeader.textContent = 'Searching...';
            let matchCount = 0;
            try {
                const searchGen = view.search(query);
                if (searchGen) {
                    for await (const result of searchGen) {
                        const matches = result.subitems || result.results || (Array.isArray(result) ? result : []);
                        for (const item of matches) {
                            matchCount++;
                            appendSearchResult(
                                item.excerpt || item.text || query,
                                item.cfi || item.href,
                                result.label || `Match ${matchCount}`,
                                query
                            );
                        }
                    }
                }
                if (matchCount === 0) {
                    searchCountHeader.textContent = 'Search Results';
                    resultsList.innerHTML = '<li class="p-2 text-slate-400 italic">No results found.</li>';
                } else {
                    searchCountHeader.textContent = `Found ${matchCount} matches`;
                }
            } catch (err) {
                console.error("Search Error:", err);
                searchCountHeader.textContent = 'Search Error';
                resultsList.innerHTML = '<li class="p-2 text-red-500">Error executing search.</li>';
            }
        }
        function appendSearchResult(snippet, target, label, query) {
            const li = document.createElement('li');
            li.className = 'p-3 rounded hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer border-b border-slate-100 dark:border-slate-800 transition-colors';
            
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const highlightedText = snippet.replace(new RegExp(`(${escapedQuery})`, 'gi'), '<mark class="bg-polyu-red/20 text-polyu-red font-bold px-0.5">$1</mark>');
            li.innerHTML = `
                <div class="font-bold text-xs sm:text-sm mb-1 text-polyu-red dark:text-red-400 truncate">${label}</div>
                <div class="text-slate-600 dark:text-slate-300 leading-relaxed text-sm sm:text-base">...${highlightedText}...</div>
            `;
            li.addEventListener('click', () => {
                if (target !== undefined) view.goTo(target);
                if (window.innerWidth < 768) closeSidebars();
            });
            resultsList.appendChild(li);
        }
        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                executeSearch();
            }
        });
    </script>
</body>
</html>
