<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Book - Translated Library</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-full bg-slate-50 text-slate-800 flex flex-col font-sans antialiased">

    <!-- TOP NAV HEADER -->
    <header class="h-16 border-b border-slate-200 bg-white/95 backdrop-blur flex items-center justify-between px-4 sm:px-8 shrink-0 sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                <i class="fa-solid fa-book-open text-base"></i>
            </div>
            <a href="index.html" class="font-bold text-slate-900 text-lg sm:text-xl tracking-tight hover:text-indigo-600 transition-colors">E-Book</a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-1 flex flex-col">
        
        <!-- PAGE TITLE HEADER -->
        <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Translated Library</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Discover over 100 titles in our library.</p>
        </div>

        <!-- FULL WIDTH SEARCH BAR -->
        <div class="mb-6 relative z-10">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="search-input" placeholder="Search catalog..." class="w-full pl-11 pr-4 py-3 text-sm bg-white border border-slate-200 rounded-xl shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400" />
        </div>

        <!-- MOBILE FILTER TOGGLE BAR (Visible on < lg screens) -->
        <div class="lg:hidden mb-4 z-10">
            <button id="btn-toggle-mobile-filters" class="w-full bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between text-slate-700 font-semibold text-sm shadow-sm hover:bg-slate-50 transition-colors">
                <span class="flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i>
                    <span>Filter & Sort Catalog</span>
                </span>
                <i id="mobile-filter-chevron" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
            </button>
        </div>

        <!-- CONTENT GRID (Sidebar + Book Grid) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start relative z-0">

            <!-- FILTER SIDEBAR -->
            <aside id="filter-pane" class="hidden lg:block lg:col-span-1 bg-white rounded-2xl border border-slate-200 p-5 space-y-5 shadow-sm lg:sticky lg:top-20 z-10">
                
                <!-- Sort By -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Sort by</label>
                    <div class="relative">
                        <select id="select-sort" class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs sm:text-sm text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer pr-8">
                            <option value="popular">Most Popular</option>
                            <option value="title-asc">Title (A-Z)</option>
                            <option value="rating-desc">Highest Rated</option>
                            <option value="author-asc">Author (A-Z)</option>
                        </select>
                        <i class="fa-solid fa-arrows-up-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <!-- Categories Accordion -->
                <div>
                    <button id="btn-toggle-categories" class="w-full flex items-center justify-between py-1 text-left focus:outline-none group">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-slate-800 transition-colors">Categories</span>
                        <i id="chevron-categories" class="fa-solid fa-chevron-up text-xs text-slate-400 group-hover:text-slate-600 transition-transform duration-200"></i>
                    </button>
                    <div id="wrapper-categories" class="space-y-2 text-xs sm:text-sm text-slate-600 max-h-52 overflow-y-auto pr-1 mt-3 transition-all">
                        <div id="category-filter-list" class="space-y-2">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <!-- Rating Accordion -->
                <div>
                    <button id="btn-toggle-ratings" class="w-full flex items-center justify-between py-1 text-left focus:outline-none group">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-slate-800 transition-colors">Rating</span>
                        <i id="chevron-ratings" class="fa-solid fa-chevron-up text-xs text-slate-400 group-hover:text-slate-600 transition-transform duration-200"></i>
                    </button>
                    <div id="wrapper-ratings" class="space-y-2 text-xs sm:text-sm mt-3 transition-all">
                        <label class="flex items-center space-x-2 cursor-pointer text-slate-600 hover:text-slate-900">
                            <input type="radio" name="rating-filter" value="0" checked class="text-indigo-600 focus:ring-indigo-500">
                            <span>All Ratings</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer text-slate-600 hover:text-slate-900">
                            <input type="radio" name="rating-filter" value="5" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-amber-400">★★★★★</span>
                            <span class="text-slate-500 text-xs">& up</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer text-slate-600 hover:text-slate-900">
                            <input type="radio" name="rating-filter" value="4" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-amber-400">★★★★☆</span>
                            <span class="text-slate-500 text-xs">& up</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer text-slate-600 hover:text-slate-900">
                            <input type="radio" name="rating-filter" value="3" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-amber-400">★★★☆☆</span>
                            <span class="text-slate-500 text-xs">& up</span>
                        </label>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <!-- Reset Filters Button -->
                <button id="btn-reset-filters" class="w-full py-2 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-lg text-xs font-semibold transition-colors flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                    <span>Reset Filters</span>
                </button>

            </aside>

            <!-- BOOK CATALOG MAIN SECTION -->
            <section class="lg:col-span-3 min-w-0">
                
                <!-- Result Count & View Toggle Header -->
                <div class="flex items-center justify-between mb-4">
                    <p id="result-count" class="text-xs sm:text-sm font-medium text-slate-500">Showing 1-6 of 6 results</p>
                    
                    <!-- V1 Pill View Toggle -->
                    <div class="bg-slate-200/70 p-1 rounded-xl flex items-center space-x-1 shadow-inner border border-slate-200/60">
                        <button id="btn-view-grid" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 bg-white text-slate-900 shadow-sm transition-all">
                            <i class="fa-solid fa-border-all text-xs"></i>
                            <span>Grid</span>
                        </button>
                        <button id="btn-view-list" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 text-slate-500 hover:text-slate-800 transition-all">
                            <i class="fa-solid fa-list text-xs"></i>
                            <span>List</span>
                        </button>
                    </div>
                </div>

                <!-- BOOK CONTAINER (GRID / LIST) -->
                <div id="book-container" class="grid grid-cols-2 sm:grid-cols-3 gap-5 sm:gap-6">
                    <!-- Cards injected via JS -->
                </div>

                <!-- EMPTY STATE -->
                <div id="empty-state" class="hidden flex-col items-center justify-center py-16 bg-white rounded-2xl border border-slate-200 text-center">
                    <div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 mb-3">
                        <i class="fa-solid fa-book-open text-xl"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-800">No matching books found</h3>
                    <p class="text-xs text-slate-500 mt-1 max-w-xs">Try relaxing your search terms or clearing selected category filters.</p>
                </div>

                <!-- PAGINATION -->
                <div class="mt-10 flex justify-center items-center space-x-1.5 text-xs font-semibold">
                    <button class="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-400 hover:bg-slate-50 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-chevron-left text-[10px]"></i>
                    </button>
                    <button class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm">1</button>
                    <button class="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center justify-center transition-colors">2</button>
                    <button class="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>

            </section>
        </div>
    </main>

    <!-- BOOK BRIEF INFO QUICK VIEW MODAL -->
    <div id="quick-view-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative animate-in fade-in zoom-in-95 duration-200">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modal-content" class="flex flex-col sm:flex-row gap-5">
                <!-- Modal content dynamically injected -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Set to true to force inline JSON; false to try fetching 'books.json' first, falling back to inline if fetch fails
        const USE_INLINE_DATA = false;

        // Fallback / Inline Central Data
        const INLINE_LIBRARY_DATA = {
            categories: [
                'FICTION',
                'SELF-HELP',
                'BUSINESS',
                'DESIGN',
                'ARCHITECTURE',
                'DEVELOPMENT',
                'HISTORICAL FICTION'
            ],
            books: [
                {
                    id: '1',
                    title: 'The Art of Observation',
                    author: 'Sarah Williams',
                    category: 'DESIGN',
                    rating: 5,
                    count: 64,
                    cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80',
                    description: 'A comprehensive guide into visual thinking, design frameworks, and modern aesthetics.',
                    progress: 45,
                    file: '1.epub'
                },
                {
                    id: '2',
                    title: 'Modern Design & Architecture',
                    author: 'David Chen',
                    category: 'ARCHITECTURE',
                    rating: 5,
                    count: 112,
                    cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=80',
                    description: 'Exploring structural aesthetics, urban planning, and sustainable building concepts.',
                    progress: 100,
                    file: '2.epub'
                },
                {
                    id: '3',
                    title: 'Journey to the Center of Thought',
                    author: 'Elena Rossi',
                    category: 'FICTION',
                    rating: 4,
                    count: 420,
                    cover: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&q=80',
                    description: 'A captivating psychological fiction following the internal monologue of a brilliant researcher.',
                    progress: 0,
                    file: '3.epub'
                },
                {
                    id: '4',
                    title: 'Invisible Worlds',
                    author: 'A. K. Rowling',
                    category: 'FANTASY',
                    rating: 5,
                    count: 310,
                    cover: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&q=80',
                    description: 'Uncover parallel dimensions hidden right in front of our eyes in this fiction masterpiece.',
                    progress: 12,
                    file: '4.epub'
                },
                {
                    id: '5',
                    title: 'The Rising Sun',
                    author: 'Kenji Sato',
                    category: 'HISTORICAL FICTION',
                    rating: 4,
                    count: 89,
                    cover: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400&q=80',
                    description: 'An inspiring saga set during the rapid cultural transformation of early 20th century East Asia.',
                    progress: 0,
                    file: '5.epub'
                },
                {
                    id: '6',
                    title: 'Clean Code & Mindsets',
                    author: 'Martin L.',
                    category: 'DEVELOPMENT',
                    rating: 5,
                    count: 156,
                    cover: 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=400&q=80',
                    description: 'Best practices, refactoring methods, and software engineering principles for modern developers.',
                    progress: 75,
                    file: '6.epub'
                }
            ]
        };

        let books = [];
        let categories = [];
        let wishlist = new Set();
        let selectedCategories = new Set();
        let currentLayout = 'grid';

        // DOM Elements
        const bookContainer = document.getElementById('book-container');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const selectSort = document.getElementById('select-sort');
        const categoryFilterList = document.getElementById('category-filter-list');
        const resultCount = document.getElementById('result-count');
        
        const btnToggleMobileFilters = document.getElementById('btn-toggle-mobile-filters');
        const filterPane = document.getElementById('filter-pane');
        const mobileFilterChevron = document.getElementById('mobile-filter-chevron');
        const btnResetFilters = document.getElementById('btn-reset-filters');

        const btnViewGrid = document.getElementById('btn-view-grid');
        const btnViewList = document.getElementById('btn-view-list');

        const btnToggleCategories = document.getElementById('btn-toggle-categories');
        const wrapperCategories = document.getElementById('wrapper-categories');
        const chevronCategories = document.getElementById('chevron-categories');

        const btnToggleRatings = document.getElementById('btn-toggle-ratings');
        const wrapperRatings = document.getElementById('wrapper-ratings');
        const chevronRatings = document.getElementById('chevron-ratings');

        const modal = document.getElementById('quick-view-modal');
        const modalContent = document.getElementById('modal-content');
        const btnCloseModal = document.getElementById('btn-close-modal');

        // Initialization Logic (Loads JSON via fetch or inline config)
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeLibraryData();
            renderCategories();
            applyFiltersAndRender();
        });

        async function initializeLibraryData() {
            if (USE_INLINE_DATA) {
                books = [...INLINE_LIBRARY_DATA.books];
                categories = [...INLINE_LIBRARY_DATA.categories];
                return;
            }

            try {
                const response = await fetch('books.json');
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                books = data.books || [];
                categories = data.categories || [];
            } catch (err) {
                console.warn('Could not load books.json, falling back to inline data:', err);
                books = [...INLINE_LIBRARY_DATA.books];
                categories = [...INLINE_LIBRARY_DATA.categories];
            }
        }

        // Accordion Toggle Logic
        btnToggleCategories.addEventListener('click', () => {
            wrapperCategories.classList.toggle('hidden');
            chevronCategories.classList.toggle('rotate-180');
        });

        btnToggleRatings.addEventListener('click', () => {
            wrapperRatings.classList.toggle('hidden');
            chevronRatings.classList.toggle('rotate-180');
        });

        // Mobile Filter Collapsible Toggle
        btnToggleMobileFilters.addEventListener('click', () => {
            filterPane.classList.toggle('hidden');
            mobileFilterChevron.classList.toggle('rotate-180');
        });

        // Populate Categories (Checkboxes) dynamically
        function renderCategories() {
            categoryFilterList.innerHTML = categories.map(cat => {
                const count = books.filter(b => b.category === cat).length;
                return `
                    <label class="flex items-center justify-between cursor-pointer hover:text-indigo-600 py-1">
                        <span class="flex items-center space-x-2">
                            <input type="checkbox" name="category-filter" value="${cat}" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span>${cat.charAt(0) + cat.slice(1).toLowerCase()}</span>
                        </span>
                        <span class="text-xs text-slate-400 font-normal">(${count})</span>
                    </label>
                `;
            }).join('');

            document.querySelectorAll('input[name="category-filter"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedCategories.add(e.target.value);
                    } else {
                        selectedCategories.delete(e.target.value);
                    }
                    applyFiltersAndRender();
                });
            });
        }

        // Apply Search, Filter, Sort
        function applyFiltersAndRender() {
            const query = searchInput.value.toLowerCase().trim();
            const sortVal = selectSort.value;
            const minRating = parseInt(document.querySelector('input[name="rating-filter"]:checked')?.value || '0', 10);

            let filtered = books.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query);
                const matchesCategory = selectedCategories.size === 0 || selectedCategories.has(b.category);
                const matchesRating = b.rating >= minRating;

                return matchesSearch && matchesCategory && matchesRating;
            });

            // Sorting
            if (sortVal === 'title-asc') filtered.sort((a, b) => a.title.localeCompare(b.title));
            if (sortVal === 'rating-desc') filtered.sort((a, b) => b.rating - a.rating);
            if (sortVal === 'author-asc') filtered.sort((a, b) => a.author.localeCompare(b.author));

            renderBookCards(filtered);
            resultCount.textContent = `Showing 1-${filtered.length} of ${filtered.length} results`;
        }

        // Grid & List View Renderer
        function renderBookCards(list) {
            bookContainer.innerHTML = '';

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            if (currentLayout === 'grid') {
                bookContainer.className = "grid grid-cols-2 sm:grid-cols-3 gap-5 sm:gap-6";
                list.forEach(book => bookContainer.appendChild(createGridCard(book)));
            } else {
                bookContainer.className = "flex flex-col space-y-3";
                list.forEach(book => bookContainer.appendChild(createListCard(book)));
            }
        }

        function createGridCard(book) {
            const isWishlisted = wishlist.has(book.id);
            const stars = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
            const card = document.createElement('div');
            card.className = "group bg-white rounded-2xl border border-slate-200 p-3 shadow-sm hover:shadow-md transition-all flex flex-col justify-between";

            card.innerHTML = `
                <div>
                    <div class="relative aspect-[2/3] bg-slate-100 rounded-xl overflow-hidden mb-3">
                        <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 group-hover:blur-sm transition-all duration-300" />

                        <div class="absolute inset-0 bg-slate-900/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center space-x-3">
                            <button onclick="openQuickView('${book.id}')" class="w-10 h-10 rounded-full bg-white text-slate-700 hover:bg-indigo-600 hover:text-white flex items-center justify-center shadow-lg transition-colors" title="Quick View">
                                <i class="fa-solid fa-eye text-sm"></i>
                            </button>
                            <button onclick="toggleWishlist('${book.id}', this)" class="w-10 h-10 rounded-full bg-white ${isWishlisted ? 'text-red-500' : 'text-slate-700'} hover:bg-red-500 hover:text-white flex items-center justify-center shadow-lg transition-colors" title="Add to Wishlist">
                                <i class="${isWishlisted ? 'fa-solid' : 'fa-regular'} fa-heart text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-[10px] font-bold tracking-wider text-indigo-600 uppercase mb-1">
                        <span>${book.category}</span>
                        <span class="text-amber-400 text-xs tracking-normal">${stars}</span>
                    </div>
                    <h3 class="font-bold text-slate-900 text-xs sm:text-sm line-clamp-1 hover:text-indigo-600 transition-colors cursor-pointer" onclick="openReader('${book.file}')" title="${book.title}">${book.title}</h3>
                    <p class="text-[11px] text-slate-500 mt-0.5">${book.author}</p>
                </div>
                <div class="mt-3 pt-2 border-t border-slate-100">
                    <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden mb-1">
                        <div class="bg-indigo-600 h-full rounded-full" style="width: ${book.progress}%"></div>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span>${book.progress > 0 ? 'Reading' : 'Unread'}</span>
                        <span>${book.progress}%</span>
                    </div>
                </div>
            `;
            return card;
        }

        function createListCard(book) {
            const isWishlisted = wishlist.has(book.id);
            const stars = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
            const card = document.createElement('div');
            card.className = "group bg-white rounded-2xl border border-slate-200 p-3 shadow-sm hover:border-indigo-300 transition-colors flex items-center justify-between gap-4";

            card.innerHTML = `
                <div class="flex items-center space-x-4 min-w-0 flex-1">
                    <div class="relative w-14 h-20 bg-slate-100 rounded-lg overflow-hidden shrink-0">
                        <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover" />
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-bold text-indigo-600 tracking-wider uppercase">${book.category}</span>
                            <span class="text-amber-400 text-xs">${stars}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm truncate hover:text-indigo-600 cursor-pointer" onclick="openReader('${book.file}')">${book.title}</h3>
                        <p class="text-xs text-slate-500">${book.author}</p>
                        <div class="flex items-center space-x-3 mt-2 max-w-xs">
                            <div class="flex-1 bg-slate-100 h-1 rounded-full overflow-hidden">
                                <div class="bg-indigo-600 h-full rounded-full" style="width: ${book.progress}%"></div>
                            </div>
                            <span class="text-[10px] font-medium text-slate-400">${book.progress}%</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2 shrink-0">
                    <button onclick="openQuickView('${book.id}')" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors" title="Quick View">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </button>
                    <button onclick="toggleWishlist('${book.id}', this)" class="p-2 rounded-lg bg-slate-100 ${isWishlisted ? 'text-red-500' : 'text-slate-600'} hover:bg-red-50 hover:text-red-500 transition-colors" title="Wishlist">
                        <i class="${isWishlisted ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>
                    </button>
                    <button onclick="openReader('${book.file}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">
                        Read
                    </button>
                </div>
            `;
            return card;
        }

        // Layout Toggle Listener
        btnViewGrid.addEventListener('click', () => {
            currentLayout = 'grid';
            btnViewGrid.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 bg-white text-slate-900 shadow-sm transition-all";
            btnViewList.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 text-slate-500 hover:text-slate-800 transition-all";
            applyFiltersAndRender();
        });

        btnViewList.addEventListener('click', () => {
            currentLayout = 'list';
            btnViewList.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 bg-white text-slate-900 shadow-sm transition-all";
            btnViewGrid.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-2 text-slate-500 hover:text-slate-800 transition-all";
            applyFiltersAndRender();
        });

        // Quick View Modal
        window.openQuickView = function(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            const stars = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);

            modalContent.innerHTML = `
                <img src="${book.cover}" class="w-32 h-44 object-cover rounded-xl shadow shrink-0 mx-auto sm:mx-0" />
                <div class="flex-1 flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-bold text-indigo-600 tracking-wider uppercase">${book.category}</span>
                        <h2 class="text-lg font-bold text-slate-900 mt-0.5">${book.title}</h2>
                        <p class="text-xs text-slate-500 font-medium">By ${book.author}</p>
                        <div class="text-amber-400 text-xs mt-1.5">${stars} <span class="text-slate-400 text-[10px]">(${book.rating}.0)</span></div>
                        <p class="text-xs text-slate-600 mt-3 line-clamp-3">${book.description}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <button onclick="openReader('${book.file}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors flex items-center space-x-2">
                            <i class="fa-solid fa-book-open"></i>
                            <span>Read Book</span>
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        };

        // Wishlist Toggle
        window.toggleWishlist = function(bookId, btn) {
            const icon = btn.querySelector('i');
            if (wishlist.has(bookId)) {
                wishlist.delete(bookId);
                btn.classList.remove('text-red-500');
                btn.classList.add('text-slate-700');
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
            } else {
                wishlist.add(bookId);
                btn.classList.add('text-red-500');
                btn.classList.remove('text-slate-700');
                icon.classList.add('fa-solid');
                icon.classList.remove('fa-regular');
            }
        };

        window.openReader = function(file) {
            window.location.href = `index.html?book=${encodeURIComponent(file)}`;
        };

        // Close Modal Listener
        btnCloseModal.addEventListener('click', () => modal.classList.add('hidden'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.add('hidden');
        });

        // Filters Event Listeners
        searchInput.addEventListener('input', applyFiltersAndRender);
        selectSort.addEventListener('change', applyFiltersAndRender);
        document.querySelectorAll('input[name="rating-filter"]').forEach(r => r.addEventListener('change', applyFiltersAndRender));

        btnResetFilters.addEventListener('click', () => {
            searchInput.value = '';
            selectSort.value = 'popular';
            selectedCategories.clear();
            document.querySelectorAll('input[name="category-filter"]').forEach(cb => cb.checked = false);
            document.querySelector('input[name="rating-filter"][value="0"]').checked = true;
            applyFiltersAndRender();
        });
    </script>
</body>
</html>
